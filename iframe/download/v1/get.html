<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <style>
      .urlAccess{
        display:block;
      }
      p:not(.urlAccess):not(.allView){ /*allViewクラスにもurlAccessクラスにも入っていない場合*/
        display:none;
      }
    </style>
  </head>
  <body>
    <p id="page" class>This page is a pseudo-page for API use.</p>
    <a id="dl" download></a>
    <script>
      //作りかけ
      const allow=[
        "https://ks-seed0310.github.io",
        "http://ks-seed0310.github.io",
        "https://ochcinfo.github.io",
        "http://ochcinfo.github.io",
        "https://ioself.github.io",
        "http://ioself.github.io"
      ]
      const dl=document.getElementById("dl")
      window.addEventListener('message',async e=>{
        if (!allow.includes(e.origin)){
          return
        }
        dl.href=e.data.url??""
        dl.click()
        let submitData
        event.source.postMessage(submitData,e.origin)
      })
      if (window.parent===window||window.top===window){
        console.error("This page is a pseudo-page for API use.")
        document.getElementById("page").classList.add("urlAccess")
      }else{
        
      }
    </script>
  </body>
</html>
